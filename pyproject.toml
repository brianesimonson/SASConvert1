[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claims-conversion"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
claims-run = "claims_python.run_claims:main"
claims-master = "claims_python.master_claims:main"
